<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tower Sign — MAKE</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  /* The sign is composed at exactly 768x192 (4:1), then scaled to fill
     whatever viewport it lands in — a desktop browser OR the Taurus widget's
     larger internal viewport. The 4:1 ratio holds by construction, so content
     always fills the panel edge-to-edge with no letterboxing or clipping. */
  #sign {
    width: 768px; height: 192px;
    flex: none;
    background: #000;
    overflow: hidden;
    position: relative;
    transform: scale(var(--s, 1));
    transform-origin: center center;
  }
  /* Thin outline only in a local browser window (viewport isn't 4:1) */
  #sign.preview { outline: 1px solid #333; }

  .slide {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 600ms ease-in-out;
    display: flex;
  }
  .slide.on { opacity: 1; }

  /* Base text treatment — heavy, uppercase, tight leading */
  .t {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 0.92;
    white-space: nowrap;
    letter-spacing: 0;
  }
  .tight { letter-spacing: -0.02em; }
  .wide  { letter-spacing: 0.06em; }
  .tighter { letter-spacing: -0.04em; }

  /* Measurer for auto-fit */
  #measure {
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 0.92;
    top: -9999px; left: -9999px;
  }
</style>
</head>
<body>
  <div id="sign"></div>
  <div id="measure"></div>

<script>
/* ============================================================
   BRIDGE TOWER — MAKE ___
   768 x 192 LED sign. Visible from I-580 at ~300'.
   Every slide: full-bleed, two Bridge colors, edge-to-edge type.
   ============================================================ */

const CYCLE_MS = 6000;
const FADE_MS  = 600;
const RELOAD_MS = 5 * 60 * 1000; // pick up new GitHub Pages deploys

const W = 768, H = 192;

// Bridge division palette
const C = {
  orange:   '#DF562A', // Storage
  marigold: '#E9A825', // Events
  steel:    '#4A7A8C', // Kitchen
  forest:   '#1B6B3A', // Garden
  crimson:  '#8B2332', // Art
  teal:     '#2A7F8C', // Coworking
  plum:     '#6B4267', // Lounge
  white:    '#FFFFFF',
  black:    '#000000',
};

// High-contrast pairs: [bg, fg, accent]. Backgrounds are always dark;
// foreground/accent are light/bright Bridge colors for max legibility.
const PAIRS = [
  [C.black,    C.marigold, C.orange],
  [C.black,    C.orange,   C.marigold],
  [C.black,    C.white,    C.orange],
  [C.black,    C.marigold, C.crimson],
  [C.black,    C.teal,     C.marigold],
  [C.black,    C.white,    C.marigold],
  [C.forest,   C.marigold, C.white],
  [C.forest,   C.white,    C.marigold],
  [C.crimson,  C.marigold, C.white],
  [C.crimson,  C.white,    C.marigold],
  [C.steel,    C.white,    C.marigold],
  [C.steel,    C.marigold, C.orange],
  [C.plum,     C.marigold, C.white],
  [C.plum,     C.white,    C.orange],
  [C.teal,     C.white,    C.marigold],
  [C.teal,     C.marigold, C.white],
];

// The completions. MAKE ___
const WORDS = [
  "trouble","connection","art","noise","food","friends",
  "out","dance","music","history","signs","friction",
  "love","resistance","change","peace","action","movement",
  "progress","a call","shelter","justice","a difference",
  "a living","room","space","waves","it count","it work",
  "it weird","it happen","contact","amends","eye contact",
  "a scene","a mess","a fuss","a home","a stand","a racket",
  "a ruckus","believers","the most","time","room for it",
  "it up","it real","it loud","it rhyme","it matter",
];

/* ------------------------------------------------------------
   Auto-fit: find the largest font-size that keeps `text` on
   one line within `maxW`, also capped by `maxH`. Integer px.
-------------------------------------------------------------*/
const measureEl = document.getElementById('measure');
function fitOneLine(text, maxW, maxH, tracking = 0, startPx = 220) {
  measureEl.style.letterSpacing = (tracking || 0) + 'em';
  measureEl.textContent = text;
  let lo = 10, hi = startPx, best = 10;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    measureEl.style.fontSize = mid + 'px';
    const w = measureEl.offsetWidth;
    const h = measureEl.offsetHeight;
    if (w <= maxW && h <= maxH) { best = mid; lo = mid + 1; }
    else { hi = mid - 1; }
  }
  return best;
}

/* ------------------------------------------------------------
   LAYOUT LIBRARY
   Each layout takes (word, pair) → returns an HTMLElement (.slide).
   Use inline styles so each slide is self-contained.
-------------------------------------------------------------*/
const LAYOUTS = [];

// 1) SPLIT — left half MAKE, right half word. Two colors collide.
LAYOUTS.push(function splitHorizontal(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  const leftW = 288, rightW = W - leftW;
  const makeSize  = fitOneLine("MAKE", leftW - 28, H - 16, -0.02);
  const wordSize  = fitOneLine(word, rightW - 28, H - 16, -0.02);
  el.innerHTML = `
    <div style="width:${leftW}px;height:100%;background:${fg};display:flex;align-items:center;justify-content:center;">
      <div class="t tighter" style="font-size:${makeSize}px;color:${bg};">MAKE</div>
    </div>
    <div style="flex:1;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;">
      <div class="t tighter" style="font-size:${wordSize}px;color:${fg};">${word}</div>
    </div>`;
  return el;
});

// 2) STACK — MAKE on top row (smaller colored bar), word huge below.
LAYOUTS.push(function stackBar(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  const barH = 58;
  const makeSize = fitOneLine("MAKE", W - 40, barH - 10, 0.08);
  const wordSize = fitOneLine(word, W - 24, H - barH - 10, -0.02);
  el.innerHTML = `
    <div style="width:100%;height:100%;background:${bg};display:flex;flex-direction:column;">
      <div style="height:${barH}px;background:${accent};display:flex;align-items:center;padding:0 20px;">
        <div class="t wide" style="font-size:${makeSize}px;color:${bg};">MAKE</div>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;">
        <div class="t tighter" style="font-size:${wordSize}px;color:${fg};">${word}</div>
      </div>
    </div>`;
  return el;
});

// 3) INLINE TAG — small MAKE block + massive word filling the rest.
LAYOUTS.push(function inlineTag(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  const tagH = 68, tagPadX = 18;
  const makeSize = fitOneLine("MAKE", 240, tagH - 8, 0.04);
  const approxTagW = makeSize * 3.1 + tagPadX * 2; // rough
  const remaining = W - approxTagW - 64;
  const wordSize = fitOneLine(word, remaining, H - 24, -0.03);
  el.innerHTML = `
    <div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;padding:0 24px;gap:24px;">
      <div style="background:${accent};padding:6px ${tagPadX}px;display:flex;align-items:center;">
        <div class="t" style="font-size:${makeSize}px;color:${bg};letter-spacing:0.04em;">MAKE</div>
      </div>
      <div class="t tighter" style="font-size:${wordSize}px;color:${fg};">${word}</div>
    </div>`;
  return el;
});

// 4) RIGHT-ALIGN — MAKE stacked left small, word huge right-bleed.
LAYOUTS.push(function rightBleed(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  const leftW = 160;
  const makeSize = fitOneLine("MAKE", leftW - 20, H/2 - 10, 0);
  const wordSize = fitOneLine(word, W - leftW - 16, H - 16, -0.03);
  el.innerHTML = `
    <div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;">
      <div style="width:${leftW}px;padding-left:20px;">
        <div class="t" style="font-size:${makeSize}px;color:${accent};letter-spacing:0.02em;">MAKE</div>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;">
        <div class="t tighter" style="font-size:${wordSize}px;color:${fg};">${word}</div>
      </div>
    </div>`;
  return el;
});

// 5) UNDERLINE — MAKE above, word below with thick underline accent.
LAYOUTS.push(function underline(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  const makeSize = fitOneLine("MAKE", W - 48, 70, 0.1);
  const wordSize = fitOneLine(word, W - 48, 96, -0.03);
  el.innerHTML = `
    <div style="width:100%;height:100%;background:${bg};display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:8px 24px;">
      <div class="t wide" style="font-size:${makeSize}px;color:${accent};letter-spacing:0.12em;">MAKE</div>
      <div style="border-bottom:6px solid ${accent};padding-bottom:0;">
        <div class="t tighter" style="font-size:${wordSize}px;color:${fg};">${word}</div>
      </div>
    </div>`;
  return el;
});

// 6) BLOCK-HIGHLIGHT — MAKE in a highlighted block inline with the word.
LAYOUTS.push(function blockHighlight(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  // Scale the full line "MAKE  word" to fit
  const combined = `MAKE ${word}`;
  const size = fitOneLine(combined, W - 32, H - 20, -0.02);
  el.innerHTML = `
    <div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;padding:0 16px;">
      <div class="t tighter" style="font-size:${size}px;color:${fg};display:flex;align-items:center;gap:${Math.round(size*0.22)}px;">
        <span style="background:${accent};color:${bg};padding:0 ${Math.round(size*0.14)}px;line-height:1;">MAKE</span><span>${word}</span>
      </div>
    </div>`;
  return el;
});

// 7) BIG DOT — oversized dot/period after word as rhythmic punctuation.
LAYOUTS.push(function punctuation(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  const topSize  = fitOneLine("MAKE", 180, 56, 0.08);
  const wordSize = fitOneLine(word + ".", W - 48, H - 70, -0.03);
  el.innerHTML = `
    <div style="width:100%;height:100%;background:${bg};padding:10px 24px;display:flex;flex-direction:column;justify-content:space-between;">
      <div class="t wide" style="font-size:${topSize}px;color:${accent};letter-spacing:0.14em;">MAKE</div>
      <div class="t tighter" style="font-size:${wordSize}px;color:${fg};">
        ${word}<span style="color:${accent};">.</span>
      </div>
    </div>`;
  return el;
});

// 8) ARROW — MAKE → word, arrow in accent.
LAYOUTS.push(function arrow(word, [bg, fg, accent]) {
  const el = document.createElement('div');
  el.className = 'slide';
  // Fit "MAKE → word" where → is a block
  const makeSize = fitOneLine("MAKE", 280, H - 40, 0);
  const arrowW = Math.round(makeSize * 1.0);
  const wordSize = fitOneLine(word, W - 280 - arrowW - 60, H - 24, -0.03);
  el.innerHTML = `
    <div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;gap:20px;padding:0 20px;">
      <div class="t tighter" style="font-size:${makeSize}px;color:${fg};">MAKE</div>
      <div style="color:${accent};font-size:${Math.round(makeSize*0.9)}px;font-weight:800;line-height:1;">→</div>
      <div class="t tighter" style="font-size:${wordSize}px;color:${accent};">${word}</div>
    </div>`;
  return el;
});

/* ------------------------------------------------------------
   ENGINE
-------------------------------------------------------------*/
const sign = document.getElementById('sign');

// Shuffle a copy so consecutive words don't repeat across reloads
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let wordQueue = shuffle(WORDS);
let wordIdx = 0;
let layoutIdx = Math.floor(Math.random() * LAYOUTS.length);
let pairIdx = Math.floor(Math.random() * PAIRS.length);
let currentSlide = null;

function nextWord() {
  if (wordIdx >= wordQueue.length) {
    // Reshuffle, avoiding an immediate repeat at the seam
    const last = wordQueue[wordQueue.length - 1];
    do { wordQueue = shuffle(WORDS); } while (wordQueue[0] === last);
    wordIdx = 0;
  }
  return wordQueue[wordIdx++];
}

function step() {
  const word = nextWord();
  const layout = LAYOUTS[layoutIdx % LAYOUTS.length];
  const pair = PAIRS[pairIdx % PAIRS.length];
  layoutIdx++;
  pairIdx += 3; // jump through palette so adjacent slides feel different
  // Light vertical jitter for pixel burn-in prevention (±6 px)
  const jitter = ((pairIdx * 7 + layoutIdx) % 7) - 3;

  const el = layout(word, pair);
  el.style.transform = `translateY(${jitter}px)`;
  sign.appendChild(el);

  // fade in new
  requestAnimationFrame(() => {
    el.classList.add('on');
    if (currentSlide) {
      currentSlide.classList.remove('on');
      const dying = currentSlide;
      setTimeout(() => { dying.remove(); }, FADE_MS + 50);
    }
    currentSlide = el;
  });
}

// Scale the 768x192 stage to fill the viewport, preserving the 4:1 ratio.
function fitStage() {
  document.documentElement.style.setProperty('--s', Math.min(window.innerWidth / W, window.innerHeight / H));
  const aspect = window.innerWidth / window.innerHeight;
  sign.classList.toggle('preview', Math.abs(aspect - W / H) > 0.05);
}
window.addEventListener('resize', fitStage);
fitStage();

// Wait for font, then go
document.fonts.ready.then(() => {
  step();
  setInterval(step, CYCLE_MS);
});

// Auto-reload to pick up new deploys
setTimeout(() => { location.reload(); }, RELOAD_MS);
</script>
</body>
</html>
