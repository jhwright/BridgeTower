<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tower Sign — MAKE</title>
<link rel="preload" as="image" href="slides/cohen-festival-date-block-768x192.png">
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url('assets/plus-jakarta-sans-800.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  /* Fill the ACTUAL viewport. The Taurus web widget renders the page at its
     own internal size (often larger than, and not necessarily exactly, 768x192),
     so every dimension below is derived from the live viewport rather than
     hardcoded pixels. This fills the panel edge-to-edge at any resolution —
     the proven approach for this player; contain/letterbox scaling shrinks it. */
  #sign {
    width: 100vw; height: 100vh;
    background: #000;
    overflow: hidden;
    position: relative;
    /* Dim before scripts load; also covers images and colored backgrounds. */
    opacity: 0.08;
  }

  .slide {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 600ms ease-in-out;
    display: flex;
  }
  .slide.on { opacity: 1; }
  .slide.campaign { transition: none; }
  .slide.campaign img { width: 100%; height: 100%; display: block; }

  /* Base text treatment — heavy, uppercase, tight leading */
  .t {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 0.92;
    white-space: nowrap;
    letter-spacing: 0;
  }
  .tight { letter-spacing: -0.02em; }
  .wide  { letter-spacing: 0.06em; }
  .tighter { letter-spacing: -0.04em; }

  /* Measurer for auto-fit */
  #measure {
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 0.92;
    top: -9999px; left: -9999px;
  }
</style>
</head>
<body>
  <div id="sign"></div>
  <div id="measure"></div>

<script src="campaign.js?v=20261008"></script>
<script src="sign-layouts.js?v=20261008"></script>
<script src="vendor/suncalc-1.9.0.js"></script>
<script src="brightness.js?v=20261009"></script>
<script>
// Apply before the rotation starts. Never flash full output during a reload.
function updateBrightness() {
  if (!window.BridgeBrightness) return; // retain the dim CSS default
  var state = BridgeBrightness.getState(Date.now());
  document.getElementById('sign').style.opacity = state.level;
  window.towerBrightnessStatus = state;
}
updateBrightness();
setInterval(updateBrightness, window.BridgeBrightness ? BridgeBrightness.config.updateMs : 30000);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) updateBrightness();
});
</script>
<script>
/* ============================================================
   BRIDGE TOWER — MAKE ___
   768 x 192 LED sign. Designed for I-580 viewing at about 200'.
   Every slide: full-bleed, two Bridge colors, edge-to-edge type.
   ============================================================ */

const CYCLE_MS = BridgeCampaign.slotMs;
const FADE_MS  = 600;
const RELOAD_MS = 5 * 60 * 1000; // pick up new GitHub Pages deploys

// Live viewport dimensions — refreshed each step() and on resize so all
// layout math fills whatever size the Taurus widget actually renders at.
let W = window.innerWidth, H = window.innerHeight;

// Bridge division palette
const C = {
  orange:   '#DF562A', // Storage
  marigold: '#E9A825', // Events
  steel:    '#4A7A8C', // Kitchen
  forest:   '#1B6B3A', // Garden
  crimson:  '#8B2332', // Art
  teal:     '#2A7F8C', // Coworking
  plum:     '#6B4267', // Lounge
  white:    '#FFFFFF',
  black:    '#000000',
};

// High-contrast pairs: [bg, fg, accent]. Backgrounds are always dark;
// foreground/accent are light/bright Bridge colors for max legibility.
const PAIRS = [
  [C.black,    C.marigold, C.orange],
  [C.black,    C.orange,   C.marigold],
  [C.black,    C.white,    C.orange],
  [C.black,    C.marigold, C.crimson],
  [C.black,    C.teal,     C.marigold],
  [C.black,    C.white,    C.marigold],
  [C.forest,   C.marigold, C.white],
  [C.forest,   C.white,    C.marigold],
  [C.crimson,  C.marigold, C.white],
  [C.crimson,  C.white,    C.marigold],
  [C.steel,    C.white,    C.marigold],
  [C.steel,    C.marigold, C.orange],
  [C.plum,     C.marigold, C.white],
  [C.plum,     C.white,    C.orange],
  [C.teal,     C.white,    C.marigold],
  [C.teal,     C.marigold, C.white],
];

// The completions. MAKE ___
const WORDS = [
  "trouble","connection","art","noise","food","friends",
  "out","dance","music","history","signs","friction",
  "love","resistance","change","peace","action","movement",
  "progress","a call","shelter","justice","a difference",
  "a living","room","space","waves","it count","it work",
  "it weird","it happen","contact","amends","eye contact",
  "a scene","a mess","a fuss","a home","a stand","a racket",
  "a ruckus","believers","the most","time","room for it",
  "it up","it real","it loud","it rhyme","it matter",
];

/* ------------------------------------------------------------
   Auto-fit: find the largest font-size that keeps `text` on
   one line within `maxW`, also capped by `maxH`. Integer px.
-------------------------------------------------------------*/
const measureEl = document.getElementById('measure');
function fitOneLine(text, maxW, maxH, tracking = 0, startPx = 220) {
  measureEl.style.letterSpacing = (tracking || 0) + 'em';
  measureEl.textContent = text;
  let lo = 10, hi = Math.max(startPx, Math.ceil(maxH * 2)), best = 10;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    measureEl.style.fontSize = mid + 'px';
    const w = measureEl.offsetWidth;
    const h = Math.max(measureEl.offsetHeight, mid);
    if (w <= maxW && h <= maxH) { best = mid; lo = mid + 1; }
    else { hi = mid - 1; }
  }
  return best;
}

/* ------------------------------------------------------------
   LAYOUT LIBRARY
   Each layout takes (word, pair) → returns an HTMLElement (.slide).
   Use inline styles so each slide is self-contained.
-------------------------------------------------------------*/
function textWidth(text, size, tracking = 0) {
  measureEl.style.fontSize = size + 'px';
  measureEl.style.letterSpacing = tracking + 'em';
  measureEl.textContent = text;
  return measureEl.getBoundingClientRect().width;
}
const LAYOUTS = BridgeLayouts(() => ({ W, H }), fitOneLine, textWidth);

/* ------------------------------------------------------------
   ENGINE
-------------------------------------------------------------*/
const sign = document.getElementById('sign');

// Shuffle a copy so consecutive words don't repeat across reloads
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let wordQueue = shuffle(WORDS);
let wordIdx = 0;
let layoutIdx = Math.floor(Math.random() * LAYOUTS.length);
let pairIdx = Math.floor(Math.random() * PAIRS.length);
let currentSlide = null;
let renderedSlot = null;
let stepTimer = null;

// Exact PDF option #3. Stretch to the live widget viewport, just like MAKE.
function festivalSlide() {
  const el = document.createElement('div');
  el.className = 'slide campaign';
  el.dataset.content = 'festival';
  const img = document.createElement('img');
  img.src = BridgeCampaign.config.artwork;
  img.alt = 'SF Leonard Cohen Festival — November 5–8';
  // Keep the message visible even if an asset request fails on the controller.
  img.onerror = () => {
    img.remove();
    el.innerHTML = `<div style="width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;font-weight:900;white-space:nowrap;position:relative;">
      <div style="position:absolute;left:2.6%;top:7%;font-size:${W * 0.077}px;letter-spacing:-.028em;line-height:1;">SF LEONARD COHEN</div>
      <div style="position:absolute;left:0;right:0;top:50%;bottom:0;display:flex;align-items:center;">
        <div style="width:58%;padding-left:2.6%;font-size:${W * 0.093}px;line-height:1;letter-spacing:-.03em;color:#E9A825;">FESTIVAL</div>
        <div style="width:42%;height:100%;display:flex;align-items:center;justify-content:center;background:#E9A825;color:#000;font-size:${W * 0.0685}px;letter-spacing:-.04em;">NOV 5–8</div>
      </div></div>`;
  };
  el.appendChild(img);
  return el;
}

function nextWord() {
  if (wordIdx >= wordQueue.length) {
    // Reshuffle, avoiding an immediate repeat at the seam
    const last = wordQueue[wordQueue.length - 1];
    do { wordQueue = shuffle(WORDS); } while (wordQueue[0] === last);
    wordIdx = 0;
  }
  return wordQueue[wordIdx++];
}

function step(force = false) {
  clearTimeout(stepTimer);
  const state = BridgeCampaign.getState(Date.now());
  // Read-only diagnostics for verification; never shown on the sign.
  window.towerSignStatus = state;
  if (!force && renderedSlot === state.absoluteSlot) {
    stepTimer = setTimeout(step, Math.max(1, state.nextAt - Date.now()));
    return;
  }
  renderedSlot = state.absoluteSlot;
  W = window.innerWidth; H = window.innerHeight;
  let el;
  if (state.showCampaign) {
    el = festivalSlide();
  } else {
    const word = nextWord();
    const layout = LAYOUTS[layoutIdx % LAYOUTS.length];
    const pair = PAIRS[pairIdx % PAIRS.length];
    layoutIdx++;
    pairIdx += 3;
    const jitter = ((pairIdx * 7 + layoutIdx) % 7) - 3;
    el = layout(word, pair);
    el.dataset.content = 'make';
    el.style.transform = `translateY(${jitter}px)`;
  }
  sign.appendChild(el);
  const previous = currentSlide;
  currentSlide = el;
  // Campaign boundaries are cuts, so transitions never consume campaign time.
  if (!previous || state.showCampaign || previous.dataset.content === 'festival') {
    el.style.transition = 'none';
    el.classList.add('on');
    if (previous) previous.remove();
  } else {
    requestAnimationFrame(() => {
      if (currentSlide !== el) return;
      el.classList.add('on');
      previous.classList.remove('on');
      setTimeout(() => { previous.remove(); }, FADE_MS + 50);
    });
  }
  stepTimer = setTimeout(step, Math.max(1, state.nextAt - Date.now()));
}

// Re-render on resize (mainly for local testing; the Taurus viewport is fixed
// once the page loads). Debounced so dragging a window stays smooth.
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => step(true), 150);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) step();
});

// Wait for font, then go
document.fonts.ready.then(() => {
  step();
});

// Auto-reload to pick up new deploys
setTimeout(() => { location.reload(); }, RELOAD_MS);
</script>
</body>
</html>
